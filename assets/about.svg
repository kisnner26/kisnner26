<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">sobre mí</title>
  <desc id="d">estudio ingeniería en sistemas, apps nativas de Apple, backend transaccional y open source</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .16  0 0 0 0 .1  0 0 0 0 .04  0 0 0 1.1 -.42"/></filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.8" fill="#1a1208" fill-opacity=".16"/></pattern>
    <style>
      .m{mix-blend-mode:multiply}
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) backwards}
      @keyframes pop{0%{opacity:0;transform:scale(1.5) rotate(-5deg)}100%{opacity:1;transform:none}}
      .rise{animation:rise .7s ease-out backwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .bob{animation:bob 4s ease-in-out infinite}
      @keyframes bob{50%{transform:translateY(-5px)}}
      .tw{animation:tw 2.6s ease-in-out infinite}
      @keyframes tw{50%{opacity:.25}}
      
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
<g transform="rotate(-0.4 404.0 148.0)"><rect x="32" y="38" width="760" height="236" rx="14" fill="#3b46a8"/><rect x="24" y="30" width="760" height="236" rx="14" fill="#f3ead8" stroke="#1a1208" stroke-width="3"/><rect x="24" y="30" width="760" height="236" rx="14" fill="url(#dots)" opacity=".6"/><rect x="24" y="30" width="760" height="236" rx="14" filter="url(#grain)" class="m" opacity=".22"/><rect x="364.0" y="20" width="80" height="24" fill="#f2b632" opacity=".92" transform="rotate(-2 404.0 30)"/></g>
<g class="rise" style="animation-delay:0.2s"><text x="56" y="92" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400" fill="#1a1208" text-anchor="start" font-style="italic" >estudio ingeniería en sistemas en la UAM y construyo</text></g>
<g class="rise" style="animation-delay:0.38s"><text x="56" y="130" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400" fill="#1a1208" text-anchor="start" font-style="italic" >apps nativas para macOS, iOS y watchOS, backend</text></g>
<g class="rise" style="animation-delay:0.56s"><text x="56" y="168" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400" fill="#1a1208" text-anchor="start" font-style="italic" >transaccional y herramientas web.</text></g>
<g class="rise" style="animation-delay:.9s"><text x="56" y="212" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="#f0683a" text-anchor="start" font-style="italic" >contribuyo a open source: radare2, rizin y Apple.</text></g>
<text x="56" y="246" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#1a1208" text-anchor="start" opacity=".62">i study information systems engineering at UAM, build native Apple apps</text>
<g class="pop" style="animation-delay:0.4s"><rect x="834" y="58" width="63" height="40" rx="20" fill="#3b46a8"/><rect x="830" y="54" width="63" height="40" rx="20" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="861.5" y="80" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1208" text-anchor="middle" >UAM</text></g>
<g class="pop" style="animation-delay:0.5s"><rect x="915" y="58" width="151" height="40" rx="20" fill="#f0683a"/><rect x="911" y="54" width="151" height="40" rx="20" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="986.5" y="80" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1208" text-anchor="middle" >managua, ni</text></g>
<g class="pop" style="animation-delay:0.6000000000000001s"><rect x="1084" y="58" width="85" height="40" rx="20" fill="#e8527c"/><rect x="1080" y="54" width="85" height="40" rx="20" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="1122.5" y="80" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1208" text-anchor="middle" >macOS</text></g>
<g class="pop" style="animation-delay:0.7000000000000001s"><rect x="834" y="114" width="63" height="40" rx="20" fill="#2a9d8f"/><rect x="830" y="110" width="63" height="40" rx="20" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="861.5" y="136" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1208" text-anchor="middle" >iOS</text></g>
<g class="pop" style="animation-delay:0.8s"><rect x="915" y="114" width="107" height="40" rx="20" fill="#7a64a8"/><rect x="911" y="110" width="107" height="40" rx="20" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="964.5" y="136" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1208" text-anchor="middle" >watchOS</text></g>
<g class="pop" style="animation-delay:0.9s"><rect x="1040" y="114" width="107" height="40" rx="20" fill="#f2b632"/><rect x="1036" y="110" width="107" height="40" rx="20" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="1089.5" y="136" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1208" text-anchor="middle" >backend</text></g>
<g class="pop" style="animation-delay:1.0s"><rect x="834" y="170" width="162" height="40" rx="20" fill="#d6362f"/><rect x="830" y="166" width="162" height="40" rx="20" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="911.0" y="192" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1a1208" text-anchor="middle" >ing. inversa</text></g>
<g class="bob"><circle cx="1010" cy="238" r="22" fill="#f0683a"/><circle cx="1010" cy="238" r="22" fill="url(#dots)"/></g>
</svg>
