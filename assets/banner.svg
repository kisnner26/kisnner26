<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Kisnner Obando</title>
  <desc id="d">Ingeniero en sistemas de información de Managua, Nicaragua. Apps de Apple, backend e ingeniería inversa.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1a1208" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <style>
      .ink{fill:none;stroke:#1a1208;stroke-linecap:round;stroke-linejoin:round}
      .draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.6s ease-out forwards}
      .d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
      .sway{transform-origin:150px 300px;animation:sway 6s ease-in-out 3s infinite}
      .fade{opacity:0;animation:fade 1.2s ease-out forwards}
      .f1{animation-delay:.6s}.f2{animation-delay:1.2s}.f3{animation-delay:1.8s}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes fade{to{opacity:1}}
      @keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.fade{animation:none;opacity:1}.sway,.blink{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#f5f0e8"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="17" fill="none" stroke="#1a1208" stroke-opacity=".18" stroke-width="3"/>

  <!-- planta -->
  <g class="sway">
    <path class="ink draw" stroke-width="5" d="M150 305V120"/>
    <path class="ink draw d2" stroke-width="5" d="M150 190C98 160 72 120 90 78c28 6 52 44 60 112"/>
    <path class="ink draw d3" stroke-width="5" d="M150 230C202 200 228 160 210 118c-28 6-52 44-60 112"/>
    <path class="ink draw d4" stroke-width="5" d="M150 150C132 118 134 88 150 62c16 26 18 56 0 88"/>
    <path class="ink" stroke-width="3" opacity=".35" d="M70 308H230"/>
  </g>

  <!-- nombre -->
  <text class="fade f1" x="300" y="148" font-family="Georgia,'Times New Roman',serif" font-size="78" font-style="italic" font-weight="700" fill="#1a1208">Kisnner Obando</text>
  <path class="ink draw d3" stroke-width="3" d="M304 172C480 182 700 162 900 176" style="stroke-dasharray:700;stroke-dashoffset:700"/>
  <text class="fade f2" x="302" y="214" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#1a1208" fill-opacity=".8">ingeniero en sistemas de información</text>
  <text class="fade f3" x="302" y="252" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#1a1208" fill-opacity=".6">apple apps · backend · ingeniería inversa<tspan class="blink">_</tspan></text>
  <text class="fade f3" x="302" y="292" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#1a1208" fill-opacity=".45">managua, nicaragua · kisnner26</text>

  <!-- garabatos -->
  <g class="fade f3" opacity="0">
    <g transform="translate(1010 60)">
      <rect class="ink" stroke-width="4" x="0" y="14" width="64" height="76" rx="20"/>
      <path class="ink" stroke-width="4" d="M12 14l6-14h28l6 14M12 90l6 14h28l6-14"/>
      <circle class="ink" stroke-width="3" cx="32" cy="52" r="3"/>
      <path class="ink" stroke-width="3" d="M32 52V36M32 52l12 6"/>
    </g>
    <g transform="translate(900 210)">
      <path class="ink" stroke-width="5" d="M22 8L0 36l22 28M78 8l22 28-22 28M58 0L42 72"/>
    </g>
    <g transform="translate(1060 215)">
      <circle class="ink" stroke-width="5" cx="30" cy="30" r="26"/>
      <path class="ink" stroke-width="6" d="M49 49l32 32"/>
    </g>
  </g>
</svg>
