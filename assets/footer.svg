<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
  <title id="t">pie</title>
  <desc id="d">hecho a mano en Managua, Nicaragua</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .16  0 0 0 0 .1  0 0 0 0 .04  0 0 0 1.1 -.42"/></filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.8" fill="#1a1208" fill-opacity=".16"/></pattern>
    <style>
      .m{mix-blend-mode:multiply}
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) backwards}
      @keyframes pop{0%{opacity:0;transform:scale(1.5) rotate(-5deg)}100%{opacity:1;transform:none}}
      .rise{animation:rise .7s ease-out backwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .bob{animation:bob 4s ease-in-out infinite}
      @keyframes bob{50%{transform:translateY(-5px)}}
      .tw{animation:tw 2.6s ease-in-out infinite}
      @keyframes tw{50%{opacity:.25}}
      @keyframes sway{to{transform:translateX(70px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="150" fill="none"/>
  <clipPath id="f"><rect width="1200" height="150" rx="20"/></clipPath>
  <g clip-path="url(#f)"><g style="animation:sway 14s ease-in-out infinite alternate"><path d="M-80 60 C 140 20, 300 100, 520 58 S 900 16, 1280 64 V 160 H-80z" fill="#3b46a8" opacity="0.9"/></g><g style="animation:sway 18s ease-in-out infinite alternate"><path d="M-80 74 C 140 34, 300 114, 520 72 S 900 30, 1280 78 V 160 H-80z" fill="#7a64a8" opacity="0.72"/></g><g style="animation:sway 22s ease-in-out infinite alternate"><path d="M-80 88 C 140 48, 300 128, 520 86 S 900 44, 1280 92 V 160 H-80z" fill="#f0683a" opacity="0.54"/></g>
    <rect x="320" y="70" width="560" height="56" rx="12" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/>
    <text x="600" y="96" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#1a1208" text-anchor="middle" font-style="italic" >hecho a mano en managua</text>
    <text x="600" y="116" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#1a1208" text-anchor="middle" opacity=".6">actualizado 2026-10-09 · datos de la api de github</text>
  </g>
</svg>
