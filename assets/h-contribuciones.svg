<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" role="img" aria-labelledby="t d">
  <title id="t">contribuciones</title>
  <desc id="d">encabezado de sección: contribuciones</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .16  0 0 0 0 .1  0 0 0 0 .04  0 0 0 1.1 -.42"/></filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.8" fill="#1a1208" fill-opacity=".16"/></pattern>
    <style>
      .m{mix-blend-mode:multiply}
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) backwards}
      @keyframes pop{0%{opacity:0;transform:scale(1.5) rotate(-5deg)}100%{opacity:1;transform:none}}
      .rise{animation:rise .7s ease-out backwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .bob{animation:bob 4s ease-in-out infinite}
      @keyframes bob{50%{transform:translateY(-5px)}}
      .tw{animation:tw 2.6s ease-in-out infinite}
      @keyframes tw{50%{opacity:.25}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g class="rise">
    <rect x="22" y="22" width="341" height="46" rx="8" fill="#3b46a8"/>
    <rect x="14" y="14" width="341" height="46" rx="8" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/>
    <text x="34" y="46" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#3b46a8" text-anchor="start" letter-spacing="2" >02</text>
    <text x="78" y="48" font-family="Georgia,'Times New Roman',serif" font-size="29" font-weight="700" fill="#1a1208" text-anchor="start" font-style="italic" >contribuciones</text>
    <path d="M381 40 C 531 14, 631 64, 791 38 S 940 18, 1186 40" fill="none" stroke="#1a1208" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000" style="animation:draw 1.6s ease-out .3s forwards"/>
    <circle cx="1186" cy="40" r="6" fill="#3b46a8" class="tw"/>
  </g>
</svg>
