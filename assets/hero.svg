<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Kisnner Obando</title>
  <desc id="d">Apps nativas para Apple, backend transaccional, ingeniería inversa y open source. Managua, Nicaragua. Abre un escritorio de vidrio con sonido.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b78b8"/><stop offset="1" stop-color="#064a73"/></linearGradient>
    <filter id="emboss" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#ffffff" flood-opacity=".9"/></filter>
