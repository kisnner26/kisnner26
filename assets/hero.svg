    </filter>
    <radialGradient id="orb" cx=".5" cy=".85" r=".9"><stop offset="0" stop-color="#eaffc9"/><stop offset=".5" stop-color="#5cd34a"/><stop offset="1" stop-color="#1f8a35"/></radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
    <filter id="ts" x="-5%" y="-10%" width="110%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation=".8" flood-color="#0a4a1f" flood-opacity=".7"/></filter>
    <clipPath id="frame"><rect width="1200" height="600" rx="34"/></clipPath>
    <clipPath id="seaclip"><rect y="318" width="1200" height="282"/></clipPath>
    <style>
      .rise{animation:rise 10s linear infinite}
      @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(calc(var(--h) * -1));opacity:0}}
      .cloud{animation:drift 90s linear infinite}
      @keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1300px)}}
      .glint{animation:glint 3.6s ease-in-out infinite}
      @keyframes glint{50%{opacity:.15;transform:scaleX(.8);transform-origin:900px 0}}
      .cta{animation:cta 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes cta{50%{transform:scale(1.04)}}
      .roles{animation:rise2 1.4s cubic-bezier(.2,.8,.2,1) backwards .3s}
      @keyframes rise2{from{opacity:0;transform:translateY(14px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
