<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 48" role="img" aria-labelledby="t d">
  <title id="t">Correo</title>
  <desc id="d">enlace: Correo</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b78b8"/><stop offset="1" stop-color="#064a73"/></linearGradient>
    <filter id="emboss" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="0" flood-color="#ffffff" flood-opacity=".9"/></filter>
    <radialGradient id="bub" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".3" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></radialGradient>
    <linearGradient id="sheen"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd4ff"/><stop offset=".5" stop-color="#1479c8"/><stop offset="1" stop-color="#1479c8"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient><filter id="ts" x="-5%" y="-10%" width="110%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#04283f" flood-opacity=".6"/></filter>
    <style>
      .go{animation:go 2.2s ease-in-out infinite}
      @keyframes go{50%{transform:translateX(3px)}}
      .bub{animation:float 12s ease-in-out infinite alternate}
      @keyframes float{from{transform:translateY(0)}to{transform:translateY(-26px)}}
      .sheen{animation:sheen 9s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes sheen{0%{transform:translateX(0)}38%,100%{transform:translateX(1500px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="132" height="46" rx="23" fill="url(#b)" stroke="#0b5f94" stroke-width="1.5"/>
  <rect x="5" y="4" width="124" height="21" rx="10.5" fill="url(#hl)"/>
  <rect x="2.5" y="2.5" width="129" height="43" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".55"/>
  <text x="59.0" y="30" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle" filter="url(#ts)">Correo</text>
  <path class="go" d="M98 24h11m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ts)"/>
