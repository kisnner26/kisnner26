<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-labelledby="t d">
  <title id="t">open source</title>
  <desc id="d">7 pull requests mergeados en 5 proyectos: ClaudeHub, PeerBeam, pyelftools, radare2, swift-llm-kit</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .16  0 0 0 0 .1  0 0 0 0 .04  0 0 0 1.1 -.42"/></filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.8" fill="#1a1208" fill-opacity=".16"/></pattern>
    <style>
      .m{mix-blend-mode:multiply}
      .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) backwards}
      @keyframes pop{0%{opacity:0;transform:scale(1.5) rotate(-5deg)}100%{opacity:1;transform:none}}
      .rise{animation:rise .7s ease-out backwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .bob{animation:bob 4s ease-in-out infinite}
      @keyframes bob{50%{transform:translateY(-5px)}}
      .tw{animation:tw 2.6s ease-in-out infinite}
      @keyframes tw{50%{opacity:.25}}
      
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
<g transform="rotate(-0.2 600.0 84.0)"><rect x="32" y="32" width="1152" height="120" rx="14" fill="#f2b632"/><rect x="24" y="24" width="1152" height="120" rx="14" fill="#f3ead8" stroke="#1a1208" stroke-width="3"/><rect x="24" y="24" width="1152" height="120" rx="14" fill="url(#dots)" opacity=".6"/><rect x="24" y="24" width="1152" height="120" rx="14" filter="url(#grain)" class="m" opacity=".22"/></g>
<g class="pop"><text x="56" y="106" font-family="Georgia,'Times New Roman',serif" font-size="84" font-weight="700" fill="#f0683a" text-anchor="start" font-style="italic" >7</text></g>
<text x="150" y="82" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="#1a1208" text-anchor="start" font-style="italic" >pull requests mergeados</text>
<text x="150" y="112" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#1a1208" text-anchor="start" opacity=".7">en 5 proyectos ajenos · 3 abiertos en revisión</text>
<g class="pop" style="animation-delay:0.3s"><rect x="563" y="59" width="116" height="34" rx="17" fill="#3b46a8"/><rect x="560" y="56" width="116" height="34" rx="17" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="618.0" y="79" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1a1208" text-anchor="middle" >ClaudeHub</text></g>
