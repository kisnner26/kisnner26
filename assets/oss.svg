<g class="pop" style="animation-delay:0.54s"><rect x="817" y="59" width="126" height="34" rx="17" fill="#e8527c"/><rect x="814" y="56" width="126" height="34" rx="17" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="877.0" y="79" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1a1208" text-anchor="middle" >pyelftools</text></g>
<g class="pop" style="animation-delay:0.6599999999999999s"><rect x="959" y="59" width="96" height="34" rx="17" fill="#2a9d8f"/><rect x="956" y="56" width="96" height="34" rx="17" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="1004.0" y="79" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1a1208" text-anchor="middle" >radare2</text></g>
<g class="pop" style="animation-delay:0.78s"><rect x="563" y="103" width="156" height="34" rx="17" fill="#f2b632"/><rect x="560" y="100" width="156" height="34" rx="17" fill="#fbf6ea" stroke="#1a1208" stroke-width="3"/><text x="638.0" y="123" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1a1208" text-anchor="middle" >swift-llm-kit</text></g>
