<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">Proyectos destacados de Kisnner Obando</title>
  <desc id="d">lumora, girasol, 2-player-web, inventario-saas y opti-hub.</desc>
  <defs>
    <style>
      .card{fill:#f5f0e8;stroke:#1a1208;stroke-opacity:.2;stroke-width:2}
      .ink{fill:none;stroke:#1a1208;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .n{font:700 30px Georgia,'Times New Roman',serif;font-style:italic;fill:#1a1208}
      .l{font:17px 'SF Mono',Menlo,Consolas,monospace;fill:#1a1208;fill-opacity:.7}
      .tag{font:13px 'SF Mono',Menlo,Consolas,monospace;fill:#1a1208;fill-opacity:.45;letter-spacing:.06em;text-anchor:end}
      .c{animation:rise .7s ease-out both}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.c{animation:none}}
    </style>
  </defs>
  <g transform="translate(0 0)"><g class="c" style="animation-delay:0.0s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#d9a441"/>
    <path class="ink" d="M40 62v0M52 52v20M64 40v44M76 48v28M88 56v12M100 62v0"/><path class="ink" d="M112 50l22 12-22 12z"/>
    <text class="n" x="32" y="122">lumora</text>
    <text class="l" x="32" y="152">lyric videos en vivo,</text>
    <text class="l" x="32" y="174">dirigidos por Claude</text>
    <text class="tag" x="360" y="40">MACOS</text>
  </g></g>
  <g transform="translate(408 0)"><g class="c" style="animation-delay:0.1s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#e0b13a"/>
    <circle class="ink" cx="64" cy="62" r="12"/><path class="ink" d="M64 36v-8M64 96v-8M38 62h-8M98 62h-8M46 44l-6-6M88 86l-6-6M82 44l6-6M46 80l-6 6"/>
    <text class="n" x="32" y="122">girasol</text>
    <text class="l" x="32" y="152">salud en el Apple Watch,</text>
    <text class="l" x="32" y="174">gratis y open source</text>
    <text class="tag" x="360" y="40">WATCHOS</text>
  </g></g>
  <g transform="translate(816 0)"><g class="c" style="animation-delay:0.2s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#5b8c85"/>
    <rect class="ink" x="36" y="46" width="72" height="42" rx="21"/><path class="ink" d="M58 58v18M49 67h18"/><circle class="ink" cx="88" cy="62" r="3"/><circle class="ink" cx="97" cy="72" r="3"/>
    <text class="n" x="32" y="122">2-player-web</text>
    <text class="l" x="32" y="152">500 minijuegos para dos</text>
    <text class="l" x="32" y="174">en un solo teclado</text>
    <text class="tag" x="360" y="40">WEB</text>
  </g></g>
  <g transform="translate(204 230)"><g class="c" style="animation-delay:0.3s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#b5654a"/>
    <g transform="translate(0 -10)"><ellipse class="ink" cx="64" cy="48" rx="26" ry="9"/><path class="ink" d="M38 48v22c0 5 12 9 26 9s26-4 26-9V48M38 70v22c0 5 12 9 26 9s26-4 26-9V70"/></g>
    <text class="n" x="32" y="122">inventario-saas</text>
    <text class="l" x="32" y="152">POS multi-tenant,</text>
    <text class="l" x="32" y="174">Laravel + Next.js</text>
    <text class="tag" x="360" y="40">BACKEND</text>
  </g></g>
  <g transform="translate(612 230)"><g class="c" style="animation-delay:0.5s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#7a6a9c"/>
    <path class="ink" d="M36 88a38 38 0 0176 0"/><path class="ink" d="M74 88l18-30"/><circle class="ink" cx="74" cy="88" r="4"/><path class="ink" d="M44 70l5 3M74 54v6M104 70l-5 3"/>
    <text class="n" x="32" y="122">opti-hub</text>
    <text class="l" x="32" y="152">optimizador de Windows 11,</text>
    <text class="l" x="32" y="174">reversible, según tu hardware</text>
    <text class="tag" x="360" y="40">WINDOWS</text>
  </g></g>
</svg>
