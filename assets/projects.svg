<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 462" role="img" aria-labelledby="t d">
  <title id="t">Proyectos destacados de Kisnner Obando</title>
  <desc id="d">lumora, anaquel, claude-pet, nexo y 2-player-web, con íconos animados.</desc>
  <defs>
    <pattern id="ht" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.7" fill="#1a1208"/></pattern>
    <style>
      .card{fill:#f6efdf;stroke:#1a1208;stroke-width:2.5}
      .ink{fill:none;stroke:#1a1208;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .n{font:700 30px Georgia,'Times New Roman',serif;font-style:italic;fill:#1a1208}
      .l{font:17px 'SF Mono',Menlo,Consolas,monospace;fill:#1a1208;fill-opacity:.72}
      .tag{font:700 12px 'SF Mono',Menlo,Consolas,monospace;fill:#1a1208;fill-opacity:.5;letter-spacing:.1em;text-anchor:end}
      .enter{animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both}
      .fl{animation:fl 6s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(26px) rotate(-2deg)}to{opacity:1;transform:none}}
      @keyframes fl{50%{transform:translateY(-4px)}}
      .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate}
      @keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
      .spin{animation:spin 9s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .beat{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
      @keyframes beat{50%{transform:scale(1.25)}}
      .btn{transform-box:fill-box;transform-origin:center;animation:btn .9s steps(1) infinite}
      @keyframes btn{0%{fill:#f0683a}50%{fill:none}}
      .scan{opacity:0;animation:scan 2.4s ease-in-out infinite}
      @keyframes scan{0%{opacity:0;transform:translateY(0)}20%{opacity:.85}100%{opacity:0;transform:translateY(44px)}}
      .flow{stroke-dasharray:4 9;animation:flow .8s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-13}}
      .cur{animation:cur 3s ease-in-out infinite}
      @keyframes cur{0%,100%{transform:translate(0,0)}35%{transform:translate(18px,10px)}70%{transform:translate(8px,-6px)}}
      .needle{animation:needle 3.2s ease-in-out infinite}
      @keyframes needle{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(55deg)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g transform="translate(6 8) rotate(-0.6 192 100)"><g class="enter" style="animation-delay:0.00s"><g class="fl" style="animation-delay:-0.0s">
    <rect x="8" y="8" width="384" height="200" rx="14" fill="#e8a92c" fill-opacity=".9"/>
    <rect class="card" x="0" y="0" width="384" height="200" rx="14"/>
    <rect x="260" y="0" width="124" height="70" rx="14" fill="url(#ht)" opacity=".1"/>
    <rect x="150" y="-9" width="84" height="22" fill="#f2b632" fill-opacity=".85" transform="rotate(-2 192 2)"/>
    <g fill="#1a1208"><rect class="eq" x="38" y="40" width="7" height="44" style="animation-duration:.7s"/><rect class="eq" x="52" y="40" width="7" height="44" style="animation-duration:.5s"/><rect class="eq" x="66" y="40" width="7" height="44" style="animation-duration:.9s"/><rect class="eq" x="80" y="40" width="7" height="44" style="animation-duration:.6s"/><rect class="eq" x="94" y="40" width="7" height="44" style="animation-duration:.8s"/></g><path class="ink" d="M116 50l22 12-22 12z"/>
    <text class="n" x="32" y="130">lumora</text>
    <text class="l" x="32" y="160">lyric videos en vivo,</text>
    <text class="l" x="32" y="182">dirigidos por Claude</text>
    <text class="tag" x="362" y="42">MACOS</text>
  </g></g></g>
  <g transform="translate(414 8) rotate(0.4 192 100)"><g class="enter" style="animation-delay:0.12s"><g class="fl" style="animation-delay:-3.3s">
    <rect x="8" y="8" width="384" height="200" rx="14" fill="#c0583d" fill-opacity=".9"/>
    <rect class="card" x="0" y="0" width="384" height="200" rx="14"/>
    <rect x="260" y="0" width="124" height="70" rx="14" fill="url(#ht)" opacity=".1"/>
    <rect x="150" y="-9" width="84" height="22" fill="#f2b632" fill-opacity=".85" transform="rotate(-2 192 2)"/>
    <g transform="translate(0 -10)"><ellipse class="ink" cx="64" cy="48" rx="26" ry="9"/><path class="ink" d="M38 48v22c0 5 12 9 26 9s26-4 26-9V48M38 70v22c0 5 12 9 26 9s26-4 26-9V70"/><ellipse class="scan" cx="64" cy="48" rx="26" ry="9" fill="#f0683a"/></g>
    <text class="n" x="32" y="130">anaquel</text>
    <text class="l" x="32" y="160">pos multi-tenant,</text>
    <text class="l" x="32" y="182">laravel + next.js</text>
    <text class="tag" x="362" y="42">BACKEND</text>
  </g></g></g>
  <g transform="translate(822 8) rotate(0.6 192 100)"><g class="enter" style="animation-delay:0.24s"><g class="fl" style="animation-delay:-5.5s">
    <rect x="8" y="8" width="384" height="200" rx="14" fill="#7a64a8" fill-opacity=".9"/>
    <rect class="card" x="0" y="0" width="384" height="200" rx="14"/>
    <rect x="260" y="0" width="124" height="70" rx="14" fill="url(#ht)" opacity=".1"/>
    <rect x="150" y="-9" width="84" height="22" fill="#f2b632" fill-opacity=".85" transform="rotate(-2 192 2)"/>
    <g class="ink"><path d="M44 42h44v10h10v28H34V52h10zM44 80v10M88 80v10M34 62H24M98 62h10"/><path d="M54 58v8M78 58v8M56 74h20"/></g>
    <text class="n" x="32" y="130">claude-pet</text>
    <text class="l" x="32" y="160">mascotas de claude code</text>
    <text class="l" x="32" y="182">y codex en tiempo real</text>
    <text class="tag" x="362" y="42">MACOS / WINDOWS</text>
  </g></g></g>
  <g transform="translate(210 244) rotate(-0.5 192 100)"><g class="enter" style="animation-delay:0.36s"><g class="fl" style="animation-delay:-4.4s">
    <rect x="8" y="8" width="384" height="200" rx="14" fill="#4a6fb0" fill-opacity=".9"/>
    <rect class="card" x="0" y="0" width="384" height="200" rx="14"/>
    <rect x="260" y="0" width="124" height="70" rx="14" fill="url(#ht)" opacity=".1"/>
    <rect x="150" y="-9" width="84" height="22" fill="#f2b632" fill-opacity=".85" transform="rotate(-2 192 2)"/>
    <rect class="ink" x="30" y="48" width="34" height="22" rx="3"/><path class="ink" d="M24 78h46"/><path class="ink flow" d="M72 62h12"/><rect class="ink" x="88" y="44" width="16" height="30" rx="4"/><path class="ink flow" d="M108 60h10"/><rect class="ink" x="122" y="52" width="14" height="18" rx="5"/><circle class="beat" cx="129" cy="61" r="2.4" fill="#f0683a"/>
    <text class="n" x="32" y="130">nexo</text>
    <text class="l" x="32" y="160">controla tu Mac desde</text>
    <text class="l" x="32" y="182">el iPhone y el Watch</text>
    <text class="tag" x="362" y="42">APPLE</text>
  </g></g></g>
  <g transform="translate(618 244) rotate(-0.4 192 100)"><g class="enter" style="animation-delay:0.48s"><g class="fl" style="animation-delay:-2.2s">
    <rect x="8" y="8" width="384" height="200" rx="14" fill="#3f8f86" fill-opacity=".9"/>
    <rect class="card" x="0" y="0" width="384" height="200" rx="14"/>
    <rect x="260" y="0" width="124" height="70" rx="14" fill="url(#ht)" opacity=".1"/>
    <rect x="150" y="-9" width="84" height="22" fill="#f2b632" fill-opacity=".85" transform="rotate(-2 192 2)"/>
    <rect class="ink" x="36" y="46" width="72" height="42" rx="21"/><path class="ink" d="M58 58v18M49 67h18"/><circle class="ink btn" cx="88" cy="62" r="3.5"/><circle class="ink btn" style="animation-delay:.45s" cx="97" cy="72" r="3.5"/>
    <text class="n" x="32" y="130">2-player-web</text>
    <text class="l" x="32" y="160">500 minijuegos para dos</text>
    <text class="l" x="32" y="182">en un solo teclado</text>
    <text class="tag" x="362" y="42">WEB</text>
  </g></g></g>
</svg>
