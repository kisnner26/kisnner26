    <text class="l" x="32" y="174">gratis y open source</text>
    <text class="tag" x="288" y="40">WATCHOS</text>
  </g></g>
  <g transform="translate(816 0)"><g class="c" style="animation-delay:0.2s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#5b8c85"/>
    <circle class="ink" cx="52" cy="62" r="14"/><path class="ink" d="M64 72l30 30M82 90l8-8M92 100l8-8"/>
    <text class="n" x="32" y="122">clavis</text>
    <text class="l" x="32" y="152">tu muñeca es la llave:</text>
    <text class="l" x="32" y="174">llavero con Apple Watch</text>
    <text class="tag" x="296" y="40">SEGURIDAD</text>
  </g></g>
  <g transform="translate(0 230)"><g class="c" style="animation-delay:0.3s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#4f7cac"/>
    <path class="ink" d="M36 62l30-18 30 18-30 18zM96 62v20c0 8-14 14-30 14s-30-6-30-14V62"/>
    <text class="n" x="32" y="122">uam-class</text>
    <text class="l" x="32" y="152">cliente nativo de macOS</text>
    <text class="l" x="32" y="174">para el Moodle de la UAM</text>
    <text class="tag" x="296" y="40">SWIFTUI</text>
  </g></g>
  <g transform="translate(408 230)"><g class="c" style="animation-delay:0.4s">
    <rect class="card" x="0" y="0" width="384" height="200" rx="16"/>
    <rect x="0" y="0" width="8" height="200" rx="4" fill="#b5654a"/>
    <ellipse class="ink" cx="64" cy="48" rx="26" ry="9"/><path class="ink" d="M38 48v22c0 5 12 9 26 9s26-4 26-9V48M38 70v22c0 5 12 9 26 9s26-4 26-9V70"/>
    <text class="n" x="32" y="122">inventario-saas</text>
    <text class="l" x="32" y="152">POS multi-tenant,</text>
    <text class="l" x="32" y="174">Laravel + Next.js</text>
