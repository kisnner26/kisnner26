  <rect x="14" y="14" width="356" height="332" rx="22" fill="url(#gt)" filter="url(#dt)"/><g clip-path="url(#ct)"><ellipse cx="192.0" cy="-52" rx="285" ry="206" fill="url(#ht)"/><g class="sheen"><rect x="-111" y="-6" width="57" height="372" fill="url(#sheen)" transform="skewX(-20)"/></g></g><rect x="14" y="14" width="356" height="332" rx="22" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="1.6"/><rect x="17" y="17" width="350" height="326" rx="19" fill="none" stroke="#fff" stroke-opacity=".35"/>
  <g class="in" style="animation-delay:0.0s">
    <text x="36" y="54" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#2b7ea6" text-anchor="start" letter-spacing="2.4" >ALTSERVER</text>
    <text x="36" y="100" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="33" font-weight="600" fill="url(#ink)" text-anchor="start" letter-spacing="-0.8" filter="url(#emboss)">Vuelve a iniciar</text>
    <text x="36" y="136" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="33" font-weight="600" fill="url(#ink)" text-anchor="start" letter-spacing="-0.8" filter="url(#emboss)">sesión.</text>
    <text x="36" y="170" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2b7ea6" text-anchor="start" >Arreglo propuesto para AltServer</text>
    <text x="36" y="190" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2b7ea6" text-anchor="start" >en macOS 27.</text>
  </g>
