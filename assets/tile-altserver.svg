<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 360" role="img" aria-labelledby="t d">
  <title id="t">Altserver</title>
  <desc id="d">Vuelve a iniciar sesión. Arreglo propuesto para AltServer en macOS 27. 637 descargas · PR abierto</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b78b8"/><stop offset="1" stop-color="#064a73"/></linearGradient>
    <filter id="emboss" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="0" flood-color="#ffffff" flood-opacity=".9"/></filter>
    <radialGradient id="bub" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".3" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></radialGradient>
    <linearGradient id="sheen"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27a4ee"/><stop offset=".55" stop-color="#8bdcff"/><stop offset="1" stop-color="#e4fbff"/></linearGradient><radialGradient id="sun" cx="60" cy="-10" r="360" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="card"><rect width="384" height="360" rx="28"/></clipPath><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/></linearGradient><linearGradient id="ht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".72"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient><clipPath id="ct"><rect x="14" y="14" width="356" height="332" rx="22"/></clipPath><filter id="dt" x="-10%" y="-10%" width="120%" height="135%"><feOffset in="SourceAlpha" dy="8" result="o"/><feGaussianBlur in="o" stdDeviation="10" result="b"/><feComposite in="b" in2="SourceAlpha" operator="out" result="s"/><feFlood flood-color="#04507f" flood-opacity=".3"/><feComposite in2="s" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="l1"><rect x="34" y="222" width="0" height="22"><animate attributeName="width" values="0;316;316;0" keyTimes="0;.12;.92;1" dur="8s" repeatCount="indefinite"/></rect></clipPath><clipPath id="l2"><rect x="34" y="248" width="0" height="22"><animate attributeName="width" values="0;0;316;316;0" keyTimes="0;.16;.28;.92;1" dur="8s" repeatCount="indefinite"/></rect></clipPath><clipPath id="l3"><rect x="34" y="274" width="0" height="22"><animate attributeName="width" values="0;0;316;316;0" keyTimes="0;.36;.46;.92;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .in{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .breathe{animation:breathe 7s ease-in-out infinite alternate}
      @keyframes breathe{from{opacity:.65}to{opacity:1}}
      .caret{animation:caret 1s steps(1) infinite}
      @keyframes caret{50%{opacity:0}}
      .bub{animation:float 12s ease-in-out infinite alternate}
      @keyframes float{from{transform:translateY(0)}to{transform:translateY(-26px)}}
      .sheen{animation:sheen 9s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes sheen{0%{transform:translateX(0)}38%,100%{transform:translateX(1500px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#card)"><rect width="384" height="360" fill="url(#sky)"/><rect width="384" height="360" fill="url(#sun)" class="breathe"/>
