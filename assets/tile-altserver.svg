  <rect x="35" y="213" width="314" height="30" rx="13" fill="#fff" fill-opacity=".1"/>
  <g clip-path="url(#l1)"><text x="50" y="240" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#fff" text-anchor="start" opacity="0.9" >$ altserver --sign-in</text></g>
  <g clip-path="url(#l2)"><text x="50" y="266" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#bfe6ff" text-anchor="start" opacity="0.65" >← 503  Service Unavailable</text></g>
  <path d="M50 262h214" stroke="#bfe6ff" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="214"><animate attributeName="stroke-dashoffset" values="214;214;0;0;214" keyTimes="0;.3;.34;.92;1" dur="8s" repeatCount="indefinite"/></path>
  <g clip-path="url(#l3)"><text x="50" y="292" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#b8ff6a" text-anchor="start" >← 200  OK · signed in</text><rect x="226" y="281" width="8" height="14" fill="#b8ff6a" class="caret"/></g>
  <text x="36" y="332" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#2b7ea6" text-anchor="start" opacity="0.85" >637 descargas · PR abierto</text>
