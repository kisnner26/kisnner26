    <text x="36" y="170" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2b7ea6" text-anchor="start" >Lyric videos en vivo con un director</text>
