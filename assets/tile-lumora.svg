    <linearGradient id="sheen"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7ff0"/><stop offset=".55" stop-color="#a3c3ff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient><radialGradient id="sun" cx="360" cy="-10" r="360" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><clipPath id="card"><rect width="384" height="360" rx="28"/></clipPath><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/></linearGradient><linearGradient id="ht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".72"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient><clipPath id="ct"><rect x="14" y="14" width="356" height="332" rx="22"/></clipPath><filter id="dt" x="-10%" y="-10%" width="120%" height="135%"><feOffset in="SourceAlpha" dy="8" result="o"/><feGaussianBlur in="o" stdDeviation="10" result="b"/><feComposite in="b" in2="SourceAlpha" operator="out" result="s"/><feFlood flood-color="#04507f" flood-opacity=".3"/><feComposite in2="s" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="jorb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f4ffe0"/><stop offset=".45" stop-color="#7fdc45"/><stop offset="1" stop-color="#2a8f2a"/></radialGradient><linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1479c8"/><stop offset=".35" stop-color="#8fe0ff"/><stop offset="1" stop-color="#1479c8"/></linearGradient><linearGradient id="fill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc8ff"/><stop offset="1" stop-color="#8be34f"/></linearGradient><clipPath id="v0"><rect x="34" y="222" width="0" height="18"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.02;0.28;.94;1" dur="8s" repeatCount="indefinite"/></rect></clipPath><clipPath id="v1"><rect x="34" y="252" width="0" height="18"><animate attributeName="width" values="0;0;224;224;0" keyTimes="0;0.32;0.58;.94;1" dur="8s" repeatCount="indefinite"/></rect></clipPath><clipPath id="v2"><rect x="34" y="282" width="0" height="18"><animate attributeName="width" values="0;0;262;262;0" keyTimes="0;0.62;0.88;.94;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .in{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .breathe{animation:breathe 7s ease-in-out infinite alternate}
      @keyframes breathe{from{opacity:.65}to{opacity:1}}
      
      .bub{animation:float 12s ease-in-out infinite alternate}
      @keyframes float{from{transform:translateY(0)}to{transform:translateY(-26px)}}
      .sheen{animation:sheen 9s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes sheen{0%{transform:translateX(0)}38%,100%{transform:translateX(1500px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
