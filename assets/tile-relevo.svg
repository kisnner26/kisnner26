    <text x="32" y="202" font-family="-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#ffffff" text-anchor="start" opacity="0.6" >y balanceador propio.</text>
  </g>
  <rect x="56" y="246" width="300" height="2" rx="1" fill="#ffffff" fill-opacity=".14"/><rect x="56" y="264" width="300" height="2" rx="1" fill="#ffffff" fill-opacity=".14"/><rect x="56" y="282" width="300" height="2" rx="1" fill="#ffffff" fill-opacity=".14"/><rect x="56" y="300" width="300" height="2" rx="1" fill="#ffffff" fill-opacity=".14"/>
