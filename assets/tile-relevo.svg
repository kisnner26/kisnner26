    <text x="36" y="136" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="33" font-weight="600" fill="url(#ink)" text-anchor="start" letter-spacing="-0.8" filter="url(#emboss)">trabajo.</text>
    <text x="36" y="170" font-family="Frutiger,'Segoe UI','SF Pro Rounded','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#2b7ea6" text-anchor="start" >Servicio en Node con worker threads</text>
